apiVersion: v1
kind: Secret
metadata:
  name: knowledge-app-secret
  namespace: knowledge-system
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REDIS_URL
  S3_ACCESS_KEY: REPLACE_WITH_STORAGE_ACCESS_KEY
  S3_SECRET_KEY: REPLACE_WITH_STORAGE_SECRET_KEY
  OPENAI_API_KEY: REPLACE_WITH_MODEL_API_KEY
  JWT_SECRET: REPLACE_WITH_RANDOM_SECRET_32_CHARS_MIN
  IDENTITY_CLIENT_SECRET: REPLACE_WITH_OIDC_CLIENT_SECRET
  IDENTITY_SESSION_SECRET: REPLACE_WITH_RANDOM_SESSION_SECRET_32_CHARS_MIN
