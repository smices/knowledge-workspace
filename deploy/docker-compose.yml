name: sn_knowledge

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: ${APP_ENV_FILE:-.env.local}
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      minio: {condition: service_started}
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["python", "-m", "worker.main"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      minio: {condition: service_started}
      migrate: {condition: service_completed_successfully}

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment file}
    ports: ["${SERVICE_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports: ["${SERVICE_BIND:-127.0.0.1}:${QDRANT_PORT:-6333}:6333", "${SERVICE_BIND:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["${SERVICE_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports: ["${SERVICE_BIND:-127.0.0.1}:${KAFKA_PORT:-9094}:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: [kafka]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        exec /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic knowledge.documents \
          --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the environment file}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the environment file}
    ports: ["${SERVICE_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000", "${SERVICE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio_data:/data"]

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
