<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>Knowledge Workspace · 登录</title>
  <link rel="stylesheet" href="/assets/login.css?v=20260820-login">
</head>
<body>
  <main class="login-experience">
    <section class="login-hero" aria-label="Knowledge Workspace">
      <div class="login-orbit login-orbit-one" aria-hidden="true"></div>
      <div class="login-orbit login-orbit-two" aria-hidden="true"></div>
      <a class="login-brand" href="/login"><span class="login-mark" id="brand-mark">K</span><span><b id="brand-name">Knowledge Workspace</b><small id="brand-tagline">企业知识助手</small></span></a>
      <div class="login-copy">
        <p>可信知识工作台</p>
        <h1>让每一个问题，<em>都有依据。</em></h1>
        <span>从已授权的企业资料中检索、核对并回看原文，让答案保持清晰可追溯。</span>
      </div>
      <div class="login-proof"><i></i><span>私有资料 · 受控访问 · 原文可回看</span></div>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-panel-top"><span>WORKSPACE ACCESS</span><small>安全登录</small></div>
      <form class="login-card local-login-form" id="local-login-form" data-login-next="/home" data-submit-label="本地账号登录" novalidate>
        <div class="login-card-icon" aria-hidden="true">↗</div>
        <p>开始使用</p>
        <h1 id="login-title">进入你的知识工作台</h1>
        <span id="login-description">使用你的本地工作区账号登录。我们不会在这里收集或保存企业身份提供商密码。</span>
        <div class="login-fields" id="local-login-fields" hidden>
          <label>用户名<input name="username" autocomplete="username" minlength="1" maxlength="64" required></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" minlength="16" maxlength="4096" required></label>
        </div>
        <div class="login-error" id="login-error" role="alert" aria-live="assertive" hidden></div>
        <button class="login-button" id="local-login-submit" type="submit" hidden>本地账号登录 <b aria-hidden="true">→</b></button>
        <a class="login-button idp-login-button" id="idp-login" href="/auth/login?next=/home" hidden>企业身份登录 <b aria-hidden="true">→</b></a>
        <small class="login-note">登录即表示你仅访问获授权的资料。</small>
        <a class="local-admin-link" href="/login/admin">本地管理员入口</a>
      </form>
      <footer><span>Evidence first</span><i></i><span>Designed for clarity</span></footer>
    </section>
  </main>
  <script src="/brand.js"></script>
  <script src="/assets/login.js?v=20260820-login"></script>
</body>
</html>
